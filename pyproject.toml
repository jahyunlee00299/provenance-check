[project]
name = "provenance-check"
dynamic = ["version"]
description = "Check that a derived constant really came from the dataset it claims: source file, hash, date, instrument, valid range, and the value actually in use."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "jahyunlee00299" }]
keywords = ["provenance", "calibration", "reproducibility", "data", "pre-commit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.scripts]
provenance-check = "provenance_check.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["provenance_check"]

[tool.setuptools.dynamic]
version = { attr = "provenance_check.__version__" }
